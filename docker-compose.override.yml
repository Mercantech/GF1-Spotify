# Lokal udvikling override fil
# Brug denne fil hvis du har problemer med hovedfilen
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: spotify-backend-local
    ports:
      - "3001:3001"
    volumes:
      - ./backend/music:/app/music
      - ./backend/covers:/app/covers
      - ./backend/data:/app/data
    environment:
      - NODE_ENV=development
    restart: unless-stopped
