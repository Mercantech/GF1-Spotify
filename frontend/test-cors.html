<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CORS Test</title>
</head>
<body>
    <h1>CORS Test</h1>
    <div id="result"></div>
    
    <script>
        const resultDiv = document.getElementById('result');
        
        // Test lokalt backend
        async function testLocalBackend() {
            try {
                const response = await fetch('http://localhost:3001/api/songs');
                const data = await response.json();
                resultDiv.innerHTML += '<p style="color: green;">✅ Lokal backend virker: ' + data.length + ' sange fundet</p>';
            } catch (error) {
                resultDiv.innerHTML += '<p style="color: red;">❌ Lokal backend fejlede: ' + error.message + '</p>';
            }
        }
        
        // Test produktion backend
        async function testProductionBackend() {
            try {
                const response = await fetch('https://gf1.mercantec.tech/api/songs');
                const data = await response.json();
                resultDiv.innerHTML += '<p style="color: green;">✅ Produktion backend virker: ' + data.length + ' sange fundet</p>';
            } catch (error) {
                resultDiv.innerHTML += '<p style="color: red;">❌ Produktion backend fejlede: ' + error.message + '</p>';
            }
        }
        
        // Kør tests
        resultDiv.innerHTML = '<p>🔄 Tester CORS...</p>';
        testLocalBackend();
        testProductionBackend();
    </script>
</body>
</html>
